<!DOCTYPE html>
<html>
<head>
    <title>Framer Motion Test</title>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "framer-motion": "https://esm.sh/framer-motion@11.11.17"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { motion } from 'framer-motion';

        function Test() {
            return React.createElement(motion.div, {
                initial: { opacity: 0, y: 50 },
                animate: { opacity: 1, y: 0 },
                transition: { duration: 1 },
                style: { padding: '20px', background: '#4a6bff', color: 'white', borderRadius: '8px', marginTop: '50px' }
            }, 'If you can see this smoothly animate in, Framer Motion is working! 🎉');
        }

        createRoot(document.getElementById('root')).render(React.createElement(Test));
    </script>
</body>
</html>
